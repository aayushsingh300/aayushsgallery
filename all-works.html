<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Works — Aayush R</title>
  <meta name="description" content="Complete project portfolio of Aayush R — Product Designer.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-globals.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink:     #d6d0c4;
      --bg-dark: #09090f;
      --bg-navy: #09090f;
      --orange:  #ff8e00;
      --coral:   #c4956a;
      --border:  rgba(255,255,255,0.08);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(180,100,60,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(80,60,160,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(10,6,20,1) 0%, #09090f 100%);
      background-attachment: fixed;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── WARM BROWN TINT OVERLAY ────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 140% 90% at 30% 35%, rgba(140, 82, 38, 0.13) 0%, rgba(100, 52, 22, 0.08) 50%, transparent 100%),
                  linear-gradient(160deg, rgba(120, 65, 25, 0.09) 0%, rgba(80, 42, 16, 0.06) 60%, rgba(50, 25, 10, 0.03) 100%);
      pointer-events: none;
      z-index: 9000;
      mix-blend-mode: multiply;
      animation: tint-breathe 12s ease-in-out infinite;
    }
    @keyframes tint-breathe {
      0%, 100% { opacity: 1; background-position: 0% 0%; }
      33%      { opacity: 0.85; background-position: 5% 3%; }
      66%      { opacity: 0.95; background-position: -3% -2%; }
    }

    /* ─── NAV ─────────────────────────────────── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 80px;
      background: rgba(8, 10, 14, 0.42);
      backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      transition: background 0.35s ease, border-color 0.35s ease;
    }
    .nav-scrolled {
      background: rgba(8, 10, 14, 0.82);
      border-bottom-color: rgba(255, 255, 255, 0.10);
    }
    .nav-logo { text-decoration: none; display: flex; align-items: center; }
    .nav-logo-svg { height: 30px; width: auto; filter: brightness(0) invert(1); opacity: 0.9; }
    .nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }
    .nav-links a {
      text-decoration: none; font-size: 14px; font-weight: 500;
      letter-spacing: 0.04em; color: rgba(214,208,196,0.7); transition: color 0.2s ease;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--ink); }
    .nav-menu { display: flex; align-items: center; gap: 12px; }
    .hamburger { display: flex; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; }
    .hamburger span { display: block; width: 24px; height: 1.5px; background: var(--ink); }

    /* ─── HEADER ───────────────────────────────── */
    .page-header {
      padding: 160px 80px 80px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: transparent;
      position: relative;
      overflow: hidden;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .page-header::before { display: none; }
    /* rotating video bg — screen blend so white areas disappear into dark bg */
    .page-header-video {
      position: absolute;
      inset: -80px;
      width: calc(100% + 160px);
      height: calc(100% + 160px);
      object-fit: cover;
      mix-blend-mode: screen;
      opacity: 0.18;
      pointer-events: none;
      animation: header-spin 90s linear infinite;
      transform-origin: center center;
    }
    @keyframes header-spin {
      from { transform: scale(1.2) rotate(0deg); }
      to   { transform: scale(1.2) rotate(360deg); }
    }
    /* gradient overlay */
    .page-header-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(26,16,16,0.6) 0%, rgba(26,16,16,0.4) 50%, rgba(26,16,16,0.88) 100%),
        radial-gradient(ellipse at 70% 40%, rgba(164,120,100,0.12) 0%, transparent 55%);
      z-index: 1;
      pointer-events: none;
    }
    .page-header > .page-label,
    .page-header > .page-title { position: relative; z-index: 2; }
    .page-label {
      font-size: 12px; font-weight: 500; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--coral); margin-bottom: 16px;
    }
    .page-title {
      font-size: clamp(48px, 6.5vw, 88px); font-weight: 600;
      letter-spacing: -1px; line-height: 0.95; color: var(--ink);
    }

    /* ─── FILTERS ──────────────────────────────── */
    .filters {
      padding: 24px 80px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      background: rgba(9,9,15,0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 50;
    }
    .filter-btn {
      padding: 8px 18px;
      border-radius: 100px;
      border: 1px solid rgba(214,208,196,0.18);
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      color: rgba(214,208,196,0.6);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
    }
    .filter-btn:hover { border-color: rgba(214,208,196,0.4); color: var(--ink); }
    .filter-btn.active {
      background: var(--coral);
      border-color: var(--coral);
      color: #221616;
    }

    /* ─── WORKS LIST ────────────────────────────── */
    .works-list {
      padding: 0 80px 100px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ─── WORK ROW CARD ─────────────────────────── */
    .work-row {
      display: grid;
      grid-template-columns: 336px 1fr;
      gap: 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--ink);
      transition: background 0.2s ease;
      overflow: hidden;
    }
    .work-row:first-child { border-top: 1px solid var(--border); }
    .work-row:hover { background: rgba(255,255,255,0.04); backdrop-filter: blur(8px); }
    .work-row.hidden { display: none; }
    /* left accent bar on hover */
    .work-row { border-left: 3px solid transparent; }
    .work-row:hover { border-left-color: var(--coral); }

    .work-image {
      position: relative;
      height: 240px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .work-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.5s cubic-bezier(0.22,1,0.36,1);
    }
    .work-row:hover .work-image img { transform: scale(1.04); }

    .work-content {
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .work-top {}
    .work-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .work-tag {
      font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--coral);
    }
    .work-tag + .work-tag::before { content: '·'; margin-right: 8px; opacity: 0.4; }
    .work-title {
      font-size: 32px; font-weight: 600; line-height: 1.15;
      letter-spacing: -0.5px; color: var(--ink); margin-bottom: 8px;
    }
    .work-subtitle {
      font-size: 14px; font-weight: 500; letter-spacing: 0.04em;
      text-transform: uppercase; color: rgba(214,208,196,0.45); margin-bottom: 20px;
    }
    .work-desc {
      font-size: 15px; font-weight: 400; line-height: 1.7;
      color: rgba(214,208,196,0.6); max-width: 440px;
    }
    .work-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 24px;
    }
    .work-meta { font-size: 12px; color: rgba(214,208,196,0.35); letter-spacing: 0.05em; text-transform: uppercase; }
    .work-arrow {
      width: 36px; height: 36px; flex-shrink: 0;
      border: 1px solid rgba(214,208,196,0.25); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .work-row:hover .work-arrow { border-color: var(--coral); background: rgba(164,120,100,0.12); }
    .work-arrow svg { width: 14px; height: 14px; }

    /* works with drawn artwork instead of a photograph */
    .work-drawn { width: 80px; height: 80px; opacity: 0.9; }

    /* status badge */
    .work-status {
      display: inline-block; font-size: 10px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 100px;
      background: rgba(255,142,0,0.12); color: var(--orange);
      margin-bottom: 12px;
    }
    .work-status-wip {
      background: rgba(255,142,0,0.18);
      color: var(--orange);
      border: 1px solid rgba(255,142,0,0.4);
    }

    /* WIP overlay on the project image */
    .work-row-wip .work-image { position: relative; overflow: hidden; }
    .work-row-wip .work-image img { filter: grayscale(35%) brightness(0.6); transition: filter 0.3s ease; }
    .work-row-wip:hover .work-image img { filter: grayscale(20%) brightness(0.7); }
    .wip-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background:
        repeating-linear-gradient(135deg, rgba(0,0,0,0.0) 0 18px, rgba(255,142,0,0.10) 18px 36px),
        linear-gradient(180deg, rgba(20,15,10,0.55), rgba(20,15,10,0.75));
      pointer-events: none;
    }
    .wip-overlay-inner {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 16px 22px; border: 1px solid rgba(255,142,0,0.55);
      background: rgba(20,15,10,0.7);
      border-radius: 4px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    }
    .wip-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--orange);
      padding: 4px 10px; border-radius: 100px;
      background: rgba(255,142,0,0.16);
      border: 1px solid rgba(255,142,0,0.45);
    }
    .wip-text {
      font-size: 12px; letter-spacing: 0.04em;
      color: rgba(214,208,196,0.88);
    }

    /* ─── FOOTER ───────────────────────────────── */
    .page-footer {
      padding: 48px 80px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .page-footer a { color: var(--orange); text-decoration: none; font-size: 14px; font-weight: 500; }
    .page-footer p { font-size: 13px; color: rgba(214,208,196,0.3); }

    /* ─── RESPONSIVE ───────────────────────────── */
    @media (max-width: 900px) {
      .nav { padding: 18px 24px; }
      .nav-links { display: none; }
      .page-header { padding: 120px 24px 48px; min-height: 280px; }
      .filters { padding: 16px 24px; gap: 6px; }
      .filter-btn { padding: 6px 14px; font-size: 12px; }
      .works-list { padding: 0 24px 80px; max-width: 100%; }
      .work-row { grid-template-columns: 1fr; }
      .work-image { height: 220px; }
      .work-content { padding: 24px 20px; }
      .work-title { font-size: 24px; }
      .page-footer { padding: 40px 24px; flex-direction: column; gap: 12px; }
    }
    @media (max-width: 540px) {
      .page-header { padding: 100px 20px 36px; }
      .works-list { padding: 0 16px 60px; }
      .work-content { padding: 20px 16px; }
      .work-title { font-size: 20px; }
      .work-image { height: 180px; }
    }
  </style>

<body>


<!-- ── HEADER ───────────────────────────────────── -->
<header class="page-header">
  <video class="page-header-video" autoplay muted loop playsinline>
    <source src="images/hero/Transforming_Objects_Portfolio_Background_Video.mp4" type="video/mp4">
  </video>
  <div class="page-header-overlay"></div>
  <p class="page-label">All Works</p>
  <h1 class="page-title">Every project,<br>in one place.</h1>
</header>

<!-- ── FILTERS ──────────────────────────────────── -->
<div class="filters" id="filterBar">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="healthcare">Healthcare</button>
  <button class="filter-btn" data-filter="defence">Defence</button>
  <button class="filter-btn" data-filter="b2b">B2B / Enterprise</button>
  <button class="filter-btn" data-filter="b2c">B2C</button>
  <button class="filter-btn" data-filter="ecommerce">E-commerce</button>
  <button class="filter-btn" data-filter="saas">SaaS</button>
  <button class="filter-btn" data-filter="design-system">Design System</button>
  <button class="filter-btn" data-filter="concept">Under NDA</button>
</div>

<!-- ── WORKS ─────────────────────────────────────── -->
<div class="works-list" id="worksList"></div>

<!-- Works render from site-data.js — the same list the studio face reads.
     Classic (non-deferred) scripts so the rows exist before the filter
     script further down queries for them. -->
<script src="site-data.js"></script>
<script>
(function () {
  var DATA = window.SITE_DATA;
  var host = document.getElementById('worksList');
  if (!DATA || !host) return;

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var ARROW = '<span class="work-arrow"><svg viewBox="0 0 14 14" fill="none">' +
    '<path d="M2 12L12 2M12 2H5M12 2V9" stroke="#D6D0C4" stroke-width="1.5" ' +
    'stroke-linecap="round" stroke-linejoin="round"/></svg></span>';

  var WIP_OVERLAY = '<div class="wip-overlay"><div class="wip-overlay-inner">' +
    '<span class="wip-badge">Work in Progress</span>' +
    '<span class="wip-text">Case study coming soon</span></div></div>';

  host.innerHTML = DATA.works.map(function (work) {
    var w = DATA.view(work, 'personal');
    var wip = w.status === 'wip';

    var image = w.image
      ? '<div class="work-image">' +
          '<img src="' + esc(w.image) + '" alt="' + esc(w.title) + '">' +
          (wip ? WIP_OVERLAY : '') +
        '</div>'
      : '<div class="work-image" style="background:#0A0E14; display:flex; ' +
          'align-items:center; justify-content:center;">' +
          (DATA.artwork[w.artwork] || '') +
        '</div>';

    var tags = (w.tagLabels || []).map(function (label) {
      return '<span class="work-tag">' + esc(label) + '</span>';
    }).join('');

    return '<a href="' + esc(w.href || '#') + '" class="work-row' +
      (wip ? ' work-row-wip' : '') + '" data-tags="' + esc(w.tags.join(' ')) + '">' +
      image +
      '<div class="work-content">' +
        '<div class="work-top">' +
          (wip ? '<span class="work-status work-status-wip">Work in Progress</span>' : '') +
          '<div class="work-tags">' + tags + '</div>' +
          '<h2 class="work-title">' + esc(w.title) + '</h2>' +
          '<p class="work-subtitle">' + esc(w.subtitle) + '</p>' +
          '<p class="work-desc">' + esc(w.blurb) + '</p>' +
        '</div>' +
        '<div class="work-bottom">' +
          '<span class="work-meta">' + esc(w.meta) + '</span>' + ARROW +
        '</div>' +
      '</div>' +
    '</a>';
  }).join('');
})();
</script>

<!-- ── FOOTER ────────────────────────────────────── -->
<footer class="page-footer">
  <a href="/">← Back to Home</a>
  <p>aayushsingh300@gmail.com</p>
</footer>

<script>
  // Nav scroll
  // nav is injected by nav-component.js and may not carry this id
  const nav = document.getElementById('mainNav');
  if (nav) {
    window.addEventListener('scroll', () => {
      nav.classList.toggle('nav-scrolled', window.scrollY > 40);
    });
  }

  // Filter logic
  const filterBtns = document.querySelectorAll('.filter-btn');
  const workRows = document.querySelectorAll('.work-row');

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const filter = btn.dataset.filter;
      workRows.forEach(row => {
        if (filter === 'all') {
          row.classList.remove('hidden');
        } else {
          const tags = (row.dataset.tags || '').split(' ');
          row.classList.toggle('hidden', !tags.includes(filter));
        }
      });
    });
  });
</script>

<script>
(function () {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;';
  document.body.insertBefore(canvas, document.body.firstChild);
  let W, H;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  const stars = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + 0.2, base: Math.random() * 0.5 + 0.08, speed: Math.random() * 0.6 + 0.2, phase: Math.random() * Math.PI * 2 }));
  const orbs = [
    { x: 0.15, y: 0.3, r: 280, color: [196,149,106], vx: 0.0002, vy: 0.0001, opacity: 0.08 },
    { x: 0.8,  y: 0.7, r: 220, color: [255,142,0],   vx: -0.0002, vy: 0.00015, opacity: 0.07 },
    { x: 0.5,  y: 0.1, r: 200, color: [100,80,180],  vx: 0.00015, vy: 0.0002, opacity: 0.06 },
  ];
  let t = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    t += 0.012;
    orbs.forEach(o => {
      o.x += o.vx; o.y += o.vy;
      if (o.x < -0.2) o.x = 1.2; if (o.x > 1.2) o.x = -0.2;
      if (o.y < -0.2) o.y = 1.2; if (o.y > 1.2) o.y = -0.2;
      const g = ctx.createRadialGradient(o.x*W, o.y*H, 0, o.x*W, o.y*H, o.r);
      g.addColorStop(0, `rgba(${o.color.join(',')},${o.opacity})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(o.x*W-o.r, o.y*H-o.r, o.r*2, o.r*2);
    });
    stars.forEach(s => {
      const op = s.base * (0.4 + 0.6 * Math.sin(t * s.speed + s.phase));
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(214,208,196,${op.toFixed(3)})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
<script src="cursor-effects.js"></script>
<script src="nav-component.js"></script>
</body>
