    <text x="42" y="546" fill="#d8a155" font-size="10" letter-spacing="2">TRUTH BEFORE ACTION</text>
    <text x="42" y="582" fill="#e8e7df" font-family="Arial,sans-serif" font-size="29" font-weight="700" letter-spacing="-1">One state. Shared by the crew.</text>
