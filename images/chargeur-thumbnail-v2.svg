    <text x="68" y="302" fill="#9da19f" font-size="11" letter-spacing="1">ARMOUR-PIERCING / TYPE 01</text>
    <rect x="68" y="338" width="316" height="62" rx="5" fill="#d8a155" fill-opacity=".12" stroke="#d8a155" stroke-opacity=".54"/>
    <text x="88" y="363" fill="#b0b3b0" font-size="9" letter-spacing="1.2">REQUESTED</text>
    <text x="88" y="387" fill="#f0f0eb" font-size="18" font-weight="700">OFL</text>
