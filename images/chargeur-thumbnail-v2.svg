<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Chargeur ammunition state interface</title>
  <desc id="desc">A code-authored view of a verified chambered round and three ammunition counts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181816"/>
      <stop offset="1" stop-color="#090a0a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8a155"/>
      <stop offset="1" stop-color="#f0be72"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <path d="M0 0h640v640H0z" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".055">
    <path d="M0 80h640M0 160h640M0 240h640M0 320h640M0 400h640M0 480h640M0 560h640"/>
    <path d="M80 0v640M160 0v640M240 0v640M320 0v640M400 0v640M480 0v640M560 0v640"/>
  </g>
