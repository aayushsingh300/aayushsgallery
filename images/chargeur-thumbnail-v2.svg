      <rect width="168" height="103" rx="8" fill="#111315" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="20" y="32" fill="#c08a5e" font-size="16" font-weight="700">OCC</text><text x="146" y="32" fill="#d8d9d5" font-size="12" text-anchor="end">8 / 12</text>
      <rect x="20" y="55" width="128" height="5" rx="2.5" fill="#24282a"/><rect x="20" y="55" width="84" height="5" rx="2.5" fill="#c08a5e"/>
      <text x="20" y="82" fill="#777c7a" font-size="9" letter-spacing="1">AVAILABLE</text>
